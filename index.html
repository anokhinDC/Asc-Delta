<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Ascensão Delta</title>
  <meta name="description" content="Ascensão Delta: fichas, habilidades, pictos, arsenal e bestiário da Expedição Delta.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;1,300;1,400;1,500&family=Jost:wght@300;400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/lumia.css">
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
</head>
<body>
  <div class="canvas" aria-hidden="true"><div class="ridge"></div></div>
  <div class="snow" aria-hidden="true"></div>
  <div class="numeral" data-numeral aria-hidden="true"></div>

  <svg width="0" height="0" style="position:absolute" aria-hidden="true">
    <filter id="brush" x="-10%" y="-30%" width="120%" height="160%">
      <feTurbulence type="fractalNoise" baseFrequency="0.035 0.6" numOctaves="3" seed="7" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="9" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
  </svg>

  <header class="topbar">
    <button class="icon-btn" data-menu aria-label="Menu"><span>≡</span></button>
    <div class="t">Ascensão <em>Delta</em></div>
  </header>

  <div class="shell">
    <aside class="nav" data-nav></aside>
    <main class="main" data-main></main>
  </div>

  <script src="assets/js/rules.js"></script>
  <script src="assets/js/seed.js"></script>
  <script src="assets/js/ui.js"></script>
  <script src="assets/js/store.js"></script>
  <script src="assets/js/views/habilidades.js"></script>
  <script src="assets/js/views/biblioteca.js"></script>
  <script src="assets/js/views/fichas.js"></script>
  <script src="assets/js/views/bestiario.js"></script>
  <script src="assets/js/views/mestre.js"></script>
  <script src="assets/js/views/codex.js"></script>
  <script src="assets/js/musica.js"></script>
  <script src="assets/js/app.js"></script>
</body>
</html>
