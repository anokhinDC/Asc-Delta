<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Expedition 33 - Mesa da Expedição</title>

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700;900&family=Cormorant+Garamond:ital,wght@0,400;0,600;0,700;1,400&family=Inter:wght@400;600&display=swap" rel="stylesheet">
    <!-- Tailwind CSS (CDN) -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        gold: '#EDE3D2',
                        'gold-dark': '#262422',
                        'e33-canvas': '#08080a',
                        'e33-umber': '#121215',
                        'e33-bone': '#ede3d2',
                        'e33-gold': '#ede3d2',
                    },
                    fontFamily: {
                        cinzel: ['Cinzel', 'serif'],
                        garamond: ['Cormorant Garamond', 'serif'],
                        inter: ['Inter', 'sans-serif'],
                    }
                }
            }
        }
    </script>
    <!-- FontAwesome for Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Custom CSS -->
    <link rel="stylesheet" href="style.css?v=38">

</head>
<body class="text-gray-200 font-inter antialiased h-screen w-screen overflow-hidden flex flex-col md:flex-row relative">
    <script>window.currentTab = 'rpg';</script>
    <script src="includes/sidebar.js"></script>

<!-- Main Dashboard -->
    <main class="flex-1 h-full overflow-y-auto relative p-4 md:p-8">
        
        <!-- Mobile Header (Hamburger) -->
        <div class="md:hidden flex justify-between items-center mb-6 glass-panel p-3 rounded-lg sticky top-0 z-30 shadow-lg bg-black/80 backdrop-blur">
            <button onclick="toggleSidebar()" class="text-gold text-2xl px-3 py-1 hover:text-white transition"><i class="fa-solid fa-bars"></i></button>
            <h1 class="text-xl font-cinzel text-gold tracking-widest font-bold">Expedition 33</h1>
            <div class="w-10"></div> <!-- spacer for centering -->
        </div>

        <div id="no-char-selected" class="h-full flex flex-col items-center justify-center text-gray-500 pb-20">
            <i class="fa-solid fa-hourglass-half text-6xl mb-4 opacity-50 text-cyan-500"></i>
            <h2 class="text-2xl font-cinzel">Mesa da Expedição 33</h2>
        </div>

        <div id="dashboard-container" class="max-w-4xl mx-auto space-y-6 hidden pb-20">
        </div>

        <div id="rpg-dashboard-container" class="max-w-7xl mx-auto space-y-6 hidden pb-20">
            <!-- Header: Clair Obscur Belle Époque (inspired by Game Title & Save Screen) -->
            <div class="flex flex-wrap justify-between items-center p-4 rounded-xl border border-stone-800 bg-[#0a0a0c]/95 shadow-2xl gap-4">
                <div class="flex items-center gap-3">
                    <div class="w-10 h-10 border border-stone-700/60 bg-[#141416] flex items-center justify-center font-cinzel font-bold text-lg text-[#ede3d2] shadow-inner shrink-0">
                        33
                    </div>
                    <div>
                        <div class="flex items-center gap-2">
                            <span class="text-stone-400 text-xs">◆</span>
                            <h2 class="text-xl md:text-2xl font-cinzel font-bold tracking-[0.2em] text-[#ede3d2] uppercase">
                                Clair Obscur
                            </h2>
                            <span class="text-stone-400 text-xs">◆</span>
                            <span class="text-xs font-semibold text-stone-400 ml-1 tracking-wider uppercase">Expedition 33</span>
                        </div>
                        <p class="text-xs text-stone-400">
                            Mesa de Confronto Reativo &bull; Rodada <span id="rpg-round-counter" class="text-[#ede3d2] font-mono font-bold">1</span>
                        </p>
                    </div>
                </div>
                <div class="flex items-center flex-wrap gap-2 text-xs">
                    <button id="btn-master-damage" class="px-2.5 py-1.5 rounded border border-stone-700 bg-stone-900/80 hover:bg-stone-800 text-stone-300 transition flex items-center gap-1.5 font-medium" title="Mestre: Aplicar Dano / Efeito">
                        <span class="e33-key text-[10px]"><i class="fa-solid fa-bolt"></i></span>
                        <span class="text-xs font-medium">Efeito / Dano</span>
                    </button>
                    <button id="btn-combat-add" class="px-3 py-1.5 rounded border border-stone-700/60 bg-[#141416] hover:bg-[#202024] text-[#ede3d2] transition flex items-center gap-1.5 font-semibold" title="Adicionar Combatente">
                        <span class="e33-key text-[10px]">+</span>
                        <span class="text-xs font-semibold">Novo Combatente</span>
                    </button>
                    <button id="btn-combat-next" class="px-3 py-1.5 rounded border border-sky-800/60 bg-sky-950/40 hover:bg-sky-900/60 text-sky-200 transition flex items-center gap-1.5 font-semibold" title="Passar para o próximo combatente (Atalho: Tab)">
                        <span class="e33-key text-[10px]"><i class="fa-solid fa-forward-step"></i></span>
                        <span class="text-xs font-semibold">Passar Turno</span>
                    </button>
                    <button id="btn-combat-clear" class="btn-icon text-stone-500 border border-stone-800 hover:text-red-400 hover:bg-red-950/20 transition" title="Limpar Mesa de Combate">
                        <i class="fa-solid fa-trash-can text-xs"></i>
                    </button>
                </div>
            </div>

            <!-- Authentic Clair Obscur Battle Arena (matches user in-game screenshots) -->
            <div id="e33-battle-arena" class="e33-canvas rounded-2xl p-6 relative overflow-hidden min-h-[580px] flex flex-col justify-between shadow-2xl border border-stone-800">
                <!-- Dynamically rendered by renderRPG() -->
            </div>

            <!-- Tactical Roster & Combat Management Drawer -->
            <div class="border border-stone-800 bg-[#0a0a0c]/95 rounded-2xl p-5 shadow-2xl space-y-4">
                <div class="flex items-center justify-between border-b border-stone-800 pb-3">
                    <h3 class="font-bold text-xs uppercase tracking-wider text-stone-300 flex items-center gap-2">
                        <i class="fa-solid fa-users-viewfinder text-stone-400"></i> Gestão Tática dos Combatentes
                    </h3>
                    <span class="text-xs text-stone-400">Ajustes manuais de HP, Postura, PA e Chroma</span>
                </div>
                <div id="combat-tracker-list" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-3.5">
                    <!-- Populated via renderRPG() -->
                </div>
            </div>

            <!-- Registro de Batalha (Expedition 33 Action Log) -->
            <div class="border border-stone-800 bg-[#0a0a0c]/95 rounded-2xl p-4 shadow-2xl">
                <div class="flex justify-between items-center mb-3 border-b border-stone-800 pb-2">
                    <h3 class="font-bold text-xs uppercase tracking-wider text-stone-300 flex items-center gap-2">
                        <i class="fa-solid fa-scroll text-stone-400"></i> Registro de Ações da Expedição
                    </h3>
                    <button class="text-xs text-stone-400 hover:text-stone-200 transition" onclick="clearCombatLog()">
                        <i class="fa-solid fa-trash-can mr-1"></i> Limpar Registro
                    </button>
                </div>
                <div id="combat-action-log" class="space-y-1.5 max-h-48 overflow-y-auto text-xs text-stone-300 font-mono pr-2 custom-scrollbar">
                    <div class="text-stone-500 italic py-2">Nenhuma ação registrada nesta rodada. Utilize os comandos para agir.</div>
                </div>
            </div>
        </div>
    </main>

    <script src="includes/modals.js?v=38"></script>

    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>

    <!-- Game Databases -->
    <script src="js/db/armor.js"></script>
    <script src="js/db/conditions.js"></script>
    <script src="js/db/perks.js"></script>
    <script src="js/db/races.js"></script>
    <script src="js/db/classes.js"></script>

    <script src="app.js?v=38" defer></script>

    <script src="js/item_manager.js"></script>
    <script src="js/status_effects.js"></script>
</body>
</html>
